spring.application.name=smart-shield-backend
server.port=8082

# ---- MySQL Database Connection ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_shield_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- Security Token Signing Secrets ----
smartshield.security.admin-token-secret=${ADMIN_TOKEN_SECRET:replace_with_secure_random_32_character_admin_secret}
smartshield.security.citizen-token-secret=${CITIZEN_TOKEN_SECRET:replace_with_secure_random_32_character_citizen_secret}

# ---- SMTP Mail Transport (Citizen Grievance & Emergency Contact Notifications) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_16_digit_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${MAIL_FROM:noreply@smartshield.gov.in}

# ---- Telegram Bot API (SOS Alerts, Grievance Registrations, Status Updates) ----
smartshield.telegram.enabled=${TELEGRAM_ENABLED:false}
smartshield.telegram.bot-token=${TELEGRAM_BOT_TOKEN:your_telegram_bot_token_from_botfather}
smartshield.telegram.bot-username=${TELEGRAM_BOT_USERNAME:SmartShieldAlertBot}
smartshield.telegram.chat-id=${TELEGRAM_CHAT_ID:your_telegram_chat_or_channel_id}

# ---- Google Maps Platform (Maps JS, Routes, Places) ----
maps.api-key=${GOOGLE_MAPS_BROWSER_KEY:${smartshield.google.maps.browser-api-key:}}
smartshield.google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_KEY:your_google_maps_browser_key}
smartshield.google.routes.enabled=${GOOGLE_ROUTES_ENABLED:true}
smartshield.google.routes.api-key=${GOOGLE_ROUTES_API_KEY:your_google_routes_server_key}
smartshield.google.places.enabled=${GOOGLE_PLACES_ENABLED:true}
smartshield.google.places.api-key=${GOOGLE_PLACES_API_KEY:your_google_places_server_key}

# ---- Google Gemini Generative AI (Civic Assistant & Multimodal Form Scanner) ----
smartshield.gemini.enabled=${GEMINI_ENABLED:false}
smartshield.gemini.api-key=${GEMINI_API_KEY:your_google_gemini_api_key}
smartshield.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
smartshield.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:10000}
